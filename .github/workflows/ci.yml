name: DiscoveryAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile Python sources
        run: python -m compileall app
      - name: Run backend unit and regression tests
        env:
          APP_ENV: test
          DEBUG: "true"
          DATABASE_URL: sqlite:///./ci.db
          NEO4J_PASSWORD: ci-test-password
          PYTHONPATH: .
        run: pytest app/tests tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Foundation check
        run: python scripts/setup/foundation_check.py
      - name: Release readiness check
        run: python scripts/evaluation/release_check.py
      - name: Docker Compose validation
        run: docker compose config
