name: Collect NLP research candidates

on:
  workflow_dispatch:
    inputs:
      max_per_query:
        description: Maximum metadata records to retrieve per search query (1-100)
        required: true
        default: "100"
      from_date:
        description: Earliest publication date (YYYY-MM-DD)
        required: true
        default: "2018-01-01"
      to_date:
        description: Latest publication date (YYYY-MM-DD)
        required: true
        default: "2025-12-31"

permissions:
  contents: read

concurrency:
  group: day2-openalex-corpus-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate inputs
        shell: bash
        run: |
          python - <<'PY'
          import os
          value = int(os.environ["MAX_PER_QUERY"])
          if not 1 <= value <= 100:
              raise SystemExit("max_per_query must be between 1 and 100")
          PY
        env:
          MAX_PER_QUERY: ${{ inputs.max_per_query }}

      - name: Collect OpenAlex discovery metadata
        run: |
          python scripts/corpus/collect_openalex_candidates.py \
            --max-per-query "${{ inputs.max_per_query }}" \
            --from-date "${{ inputs.from_date }}" \
            --to-date "${{ inputs.to_date }}"

      - name: Upload discovery pool and provenance logs
        uses: actions/upload-artifact@v7
        with:
          name: openalex-nlp-discovery-${{ github.run_id }}
          path: data/raw/openalex_discovery/
          if-no-files-found: error
          retention-days: 90
