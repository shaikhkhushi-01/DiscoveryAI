name: Phase 4 Live Readiness

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm this is a read-only dependency preflight (no model generation)."
        required: true
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read

concurrency:
  group: phase4-live-readiness
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ inputs.confirm_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBEDDING_PROVIDER: sentence-transformers
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run read-only Phase 4 readiness check
        id: readiness
        run: |
          python ../scripts/evaluation/check_phase4_readiness.py --allow-blocked > ../phase4-readiness-report.json
          python -c "import json; p=json.load(open('../phase4-readiness-report.json', encoding='utf-8')); print(json.dumps({'ready': p.get('ready'), 'blocked_checks': p.get('blocked_checks'), 'safety': p.get('safety')}, indent=2))"
      - name: Upload sanitized readiness report
        if: always() && hashFiles('../phase4-readiness-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase4-readiness-report
          path: ../phase4-readiness-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when live dependencies are not ready
        if: steps.readiness.outcome == 'success'
        run: |
          python -c "import json,sys; p=json.load(open('../phase4-readiness-report.json', encoding='utf-8')); sys.exit(0 if p.get('ready') else 1)"
