name: DiscoveryAI Scheduled Indexing Worker

on:
  # Run immediately after indexing-worker fixes are merged to main.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/indexing-worker.yml"
      - "backend/app/**"
      - "backend/requirements.txt"
  schedule:
    # GitHub schedules are best-effort; runs can start later than this interval.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discoveryai-indexing-worker
  cancel-in-progress: false

jobs:
  indexing:
    name: Drain PostgreSQL indexing queue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: scientific_chunks
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE || 'neo4j' }}
      # Must match the Render API: Qdrant vectors from different embedding
      # providers are not interchangeable, even when dimensions are equal.
      EMBEDDING_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIMENSION: "384"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-minilm-l6-v2-v1
          restore-keys: |
            ${{ runner.os }}-minilm-l6-v2-

      - name: Validate production connection secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import socket
          import sys
          from urllib.parse import urlsplit

          required = (
              "DATABASE_URL",
              "QDRANT_URL",
              "QDRANT_API_KEY",
              "NEO4J_URI",
              "NEO4J_USERNAME",
              "NEO4J_PASSWORD",
              "GEMINI_API_KEY",
          )
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          for name in ("DATABASE_URL", "QDRANT_URL", "NEO4J_URI"):
              value = os.environ[name].lower()
              if "localhost" in value or "127.0.0.1" in value:
                  print(f"{name} points to localhost; refusing to run against a local default.")
                  sys.exit(1)

          # The previous worker secret resolved to IPv6, which GitHub-hosted
          # runners could not reach. Require the Supabase Session Pooler and
          # verify IPv4 DNS before downloading the embedding model.
          parsed = urlsplit(os.environ["DATABASE_URL"])
          host = parsed.hostname or ""
          if not host.endswith(".pooler.supabase.com"):
              print(
                  "DATABASE_URL must use the current Supabase Session Pooler "
                  "hostname (*.pooler.supabase.com), not the old Neon or "
                  "Supabase direct database hostname. Update the GitHub Actions "
                  "DATABASE_URL secret to the same Supabase pooler database "
                  "used by the Render API."
              )
              sys.exit(1)
          try:
              addresses = socket.getaddrinfo(
                  host, parsed.port or 5432, family=socket.AF_INET,
                  type=socket.SOCK_STREAM,
              )
          except OSError as exc:
              print(f"Supabase pooler IPv4 DNS lookup failed ({type(exc).__name__}).")
              sys.exit(1)
          if not addresses:
              print("Supabase pooler did not return an IPv4 address; worker cannot connect.")
              sys.exit(1)

          if os.getenv("EMBEDDING_PROVIDER") != "gemini":
              print("Worker embedding provider must be gemini to match the Render API.")
              sys.exit(1)

          print("Required secrets are present and Supabase pooler resolves to IPv4; values are not displayed.")
          PY

      - name: Install CPU-only PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Drain pending indexing jobs
        run: python -m app.worker --drain --max-runtime-seconds 21000
