name: DiscoveryAI Scheduled Indexing Worker

on:
  schedule:
    # GitHub scheduled workflows are best-effort and may start a little late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discoveryai-indexing-worker
  cancel-in-progress: false

jobs:
  indexing:
    name: Drain PostgreSQL indexing queue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: scientific_chunks
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE || 'neo4j' }}
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: "384"
      HF_HOME: ${{ runner.temp }}/huggingface

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: ${{ runner.os }}-minilm-l6-v2-v1
          restore-keys: |
            ${{ runner.os }}-minilm-l6-v2-

      - name: Validate production connection secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          required = (
              "DATABASE_URL",
              "QDRANT_URL",
              "QDRANT_API_KEY",
              "NEO4J_URI",
              "NEO4J_USERNAME",
              "NEO4J_PASSWORD",
          )
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          forbidden = ("localhost", "127.0.0.1")
          for name in ("DATABASE_URL", "QDRANT_URL", "NEO4J_URI"):
              if any(host in os.environ[name].lower() for host in forbidden):
                  print(f"{name} points to localhost; refusing to run against a local default.")
                  sys.exit(1)
          print("Required connection secrets are present; values are not displayed.")
          PY

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Drain pending indexing jobs
        run: python -m app.worker --drain --max-runtime-seconds 21000
